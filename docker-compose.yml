services:
  codex-card:
    image: codex-card-fixed:latest
    container_name: "8000"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 持久化数据：数据库、上传图片、调研报告、CSV 导出
      - card_database:/app/database
      - card_uploads:/app/uploads
      - card_reports:/app/reports
      - card_out:/app/out
      # API 配置（含 api_config.json）
      - card_config:/app/config
    environment:
      - OCR_THREADS=10             # OCR 并发线程数
      # ADMIN_PASSWORD 在 app.py 中硬编码为 1234，如需修改请直接改代码
    networks:
      - claw_default

volumes:
  card_database:
    name: codex_card_database
    external: true
  card_uploads:
    name: codex_card_uploads
    external: true
  card_reports:
    name: codex_card_reports
    external: true
  card_out:
    name: codex_card_out
    external: true
  card_config:
    name: codex_card_config
    external: true

networks:
  claw_default:
    name: claw_default
    external: true
